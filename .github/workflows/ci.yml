name: shed CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting check
        run: cargo fmt --check

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Upload coverage info to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - run: nix build --no-link

  termux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # checkout runs on the glibc host; only the build runs inside Termux,
      # because a `container:` job breaks checkout (GitHub's injected Node is
      # glibc-linked and won't run in the bionic Termux image).
      - name: Build with cargo inside Termux (x86_64)
        run: |
          docker run --rm -v "$PWD:/repo" termux/termux-docker:x86_64 bash -lc '
            set -eux
            pkg update -y
            pkg install -y rust clang
            export CARGO_TARGET_DIR="$HOME/target"
            cd /repo
            cargo build --locked
          '

  mac-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - name: Test
        timeout-minutes: 5
        run: cargo test
